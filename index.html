<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>출결 관리 시스템</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 20px; }
    .card { border: 1px solid #ccc; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    input, select, button { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; }
    button { background-color: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; }
    button:hover { background-color: #0056b3; }
    .logout-btn { background-color: #dc3545; }
    .logout-btn:hover { background-color: #c82333; }
    .hidden { display: none; }
    .header { display: flex; justify-content: space-between; align-items: center; }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      GoogleAuthProvider, 
      signInWithPopup, 
      onAuthStateChanged, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getDatabase, 
      ref, 
      set, 
      onValue 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Firebase 설정 정보
    const firebaseConfig = {
      apiKey: "AIzaSyCRyCplQ8n2RBqzLtKYJ216_FBMQGNyNEg",
      authDomain: "attendance-1012d.firebaseapp.com",
      databaseURL: "https://attendance-1012d-default-rtdb.firebaseio.com",
      projectId: "attendance-1012d",
      storageBucket: "attendance-1012d.firebasestorage.app",
      messagingSenderId: "830592757343",
      appId: "1:830592757343:web:ad07de8d03d5a4588eb5ea",
      measurementId: "G-T1S6FHCVKZ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);
    const provider = new GoogleAuthProvider();

    // 구글 로그인 버튼
    document.getElementById("loginBtn").addEventListener("click", () => {
      signInWithPopup(auth, provider)
        .then(() => {
          document.getElementById("loginError").innerText = "";
        })
        .catch((error) => {
          document.getElementById("loginError").innerText = "로그인 오류: " + error.message;
        });
    });

    // 로그아웃 버튼
    document.getElementById("logoutBtn").addEventListener("click", () => {
      signOut(auth);
    });

    // 로그인 상태 체크 및 화면 전환
    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById("loginSection").classList.add("hidden");
        document.getElementById("appSection").classList.remove("hidden");
        document.getElementById("userInfo").innerText = user.displayName || user.email;
        initAttendanceSystem();
      } else {
        document.getElementById("loginSection").classList.remove("hidden");
        document.getElementById("appSection").classList.add("hidden");
      }
    });

    // 출결 기능
    function initAttendanceSystem() {
      const attendanceRef = ref(database, 'attendance');

      onValue(attendanceRef, (snapshot) => {
        const data = snapshot.val();
        const listElement = document.getElementById("attendanceList");
        listElement.innerHTML = "";

        if (data) {
          Object.keys(data).forEach((key) => {
            const li = document.createElement("li");
            li.innerText = `${data[key].name} - 상태: ${data[key].status}`;
            listElement.appendChild(li);
          });
        } else {
          listElement.innerHTML = "<li>등록된 출결 정보가 없습니다.</li>";
        }
      });

      document.getElementById("saveBtn").onclick = () => {
        const name = document.getElementById("studentName").value.trim();
        const status = document.getElementById("status").value;

        if (!name) return alert("학생 이름을 입력하세요.");

        const newItemRef = ref(database, 'attendance/' + Date.now());
        set(newItemRef, {
          name: name,
          status: status,
          updatedAt: new Date().toISOString()
        }).then(() => {
          document.getElementById("studentName").value = "";
        });
      };
    }
  </script>
</head>
<body>

  <!-- 로그인 화면 (기존 스타일 유지) -->
  <div id="loginSection" class="card">
    <h2>로그인</h2>
    <p>시스템 이용을 위해 구글 계정으로 로그인해 주세요.</p>
    <button id="loginBtn">Google 계정으로 로그인</button>
    <p id="loginError" style="color: red; margin-top: 10px;"></p>
  </div>

  <!-- 메인 출결 화면 (기존 스타일 유지) -->
  <div id="appSection" class="card hidden">
    <div class="header">
      <h2>출결 관리 System</h2>
      <button id="logoutBtn" class="logout-btn" style="width: auto;">로그아웃</button>
    </div>
    <p>접속자: <span id="userInfo"></span></p>
    <hr>
    
    <h3>출결 입력</h3>
    <input type="text" id="studentName" placeholder="학생 이름">
    <select id="status">
      <option value="출석">출석</option>
      <option value="결석">결석</option>
      <option value="지각">지각</option>
    </select>
    <button id="saveBtn">저장하기</button>

    <h3>출결 현황</h3>
    <ul id="attendanceList"></ul>
  </div>

</body>
</html>
